spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/odontogestion}
    username: ${DB_USER:odonto}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USER:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
  mvc:
    problemdetails:
      enabled: true
  autoconfigure:
    # C-02 define la cadena de seguridad y el usuario real; evita la contraseña aleatoria en el log.
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

server:
  servlet:
    session:
      timeout: ${SESSION_TIMEOUT_MIN:30}m
      cookie:
        name: JSESSIONID
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
      tracking-modes: cookie

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  timezone: ${APP_TIMEZONE:America/Argentina/Buenos_Aires}
  reminder-hours-before: ${REMINDER_HOURS_BEFORE:24}
  pending-request-ttl-min: ${PENDING_REQUEST_TTL_MIN:30}
  public-rate-limit-per-hour: ${PUBLIC_RATE_LIMIT_PER_HOUR:5}
  notification-channels: ${NOTIFICATION_CHANNELS:EMAIL}
  mail-from: ${MAIL_FROM:no-reply@consultorio.example}
  notifications:
    poll-interval: ${NOTIFICATION_POLL_INTERVAL:PT5M}
    max-intentos: 3
    esperas: PT1M,PT5M
    lote: 50
  turnos:
    # Cada cuánto corre el job que expira solicitudes pendientes vencidas (C-07 D8).
    expiracion-intervalo: PT1M
  bootstrap:
    odontologo-email: ${BOOTSTRAP_ODONTOLOGO_EMAIL:odontologo@consultorio.example}
    odontologo-password: ${BOOTSTRAP_ODONTOLOGO_PASSWORD:}
