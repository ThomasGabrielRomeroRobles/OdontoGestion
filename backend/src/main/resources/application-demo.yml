# Demo local: Spring Boot sirve el build del frontend (static/) y la API desde un solo origen.
spring:
  web:
    resources:
      cache:
        period: 1h
logging:
  level:
    ar.edu.odontogestion: INFO
app:
  seed-demo:
    # Datos ficticios de la demo (C-12 D2): 10 pacientes y turnos de la semana en curso, sin enviar emails.
    # Solo siembra si el consultorio no tiene pacientes. Para apagarlo: APP_SEED_DEMO_ENABLED=false.
    enabled: ${APP_SEED_DEMO_ENABLED:true}
